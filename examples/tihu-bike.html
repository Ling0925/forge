<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>醍醐骑单车 · SVG 动画</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    padding: 28px;
    background: radial-gradient(circle at 50% 12%, #332c4d, #14111f 68%);
    color: #e9e3f2;
    font-family: ui-sans-serif, system-ui, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    margin: 0;
    display: grid;
    gap: 16px;
    justify-items: center;
    width: min(100%, 980px);
  }
  .stage {
    width: 100%;
    border-radius: 24px;
    overflow: hidden;
    background: #241b33;
    box-shadow:
      0 40px 90px -34px rgba(0, 0, 0, .9),
      0 0 0 1px rgba(255, 255, 255, .08) inset;
  }
  .stage svg { display: block; width: 100%; height: auto; }
  .card figcaption {
    font-size: 12px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: #9d90bb;
  }
  .card figcaption b {
    color: #f2b544;
    font-weight: 600;
  }
</style>
</head>
<body>
<figure class="card">
  <div class="stage">
    <svg id="scene" viewBox="0 0 900 560" role="img" aria-label="醍醐戴着黄色头盔，骑着青色单车穿过黄昏的公路">
      <defs>

        <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">

        </linearGradient>
        <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">

        </linearGradient>
        <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">

      </defs>

      <!-- 天空 -->

        <line y1="266" y2="266" x1="0" x2="0"/>

        <ellipse cx="640" cy="472" rx="92" ry="10" fill="#0b0813" opacity="0.5"/>

        <!-- 远侧腿 -->

              stroke-linecap="round" stroke-linejoin="round" d=""/>

        <!-- 远侧曲柄 + 踏板 + 鞋 -->

        <g id="pedalFar">

          <path d="M -15 -2 L 9 -2 Q 18 -2 18 -10 L 5 -15 Q -10 -15 -15 -6 Z" fill="#39415c"/>
        </g>

        <!-- 后轮 -->

          <circle cx="330" cy="380" r="79" fill="none" stroke="#cdc7bb" stroke-width="5"/>
          <g stroke="#b9b2a4" stroke-width="1.8" opacity="0.85">
            <line x1="330" y1="380" x2="406" y2="380"/>
            <line x1="330" y1="380" x2="368" y2="445.8"/>
            <line x1="330" y1="380" x2="292" y2="445.8"/>
            <line x1="330" y1="380" x2="254" y2="380"/>
            <line x1="330" y1="380" x2="292" y2="314.2"/>
            <line x1="330" y1="380" x2="368" y2="314.2"/>
          </g>
          <circle cx="330" cy="380" r="8" fill="#e6e0d3"/>
          <circle cx="330" cy="303" r="3.2" fill="#ef5b4c"/>
        </g>

        <!-- 车架 -->
        <g fill="none" stroke-linecap="round">
          <path d="M 330 380 L 444 252" stroke="#2aa79b" stroke-width="8"/>
          <path d="M 330 380 L 460 380" stroke="#2aa79b" stroke-width="9"/>
          <path d="M 460 380 L 444 252" stroke="#2aa79b" stroke-width="10"/>
          <path d="M 444 252 L 600 246" stroke="#2aa79b" stroke-width="10"/>
          <path d="M 460 380 L 612 286" stroke="#2aa79b" stroke-width="11"/>
          <path d="M 600 246 L 612 286" stroke="#1f8a80" stroke-width="15"/>
          <path d="M 612 286 L 640 380" stroke="#2a2f45" stroke-width="10"/>
        </g>
        <rect x="396" y="238" width="70" height="16" rx="8" fill="#2a2f45"
              transform="rotate(-4 431 246)"/>

        <!-- 前轮 -->
        <g id="frontWheel">
          <circle cx="640" cy="380" r="88" fill="none" stroke="#221d33" stroke-width="13"/>
          <circle cx="640" cy="380" r="79" fill="none" stroke="#cdc7bb" stroke-width="5"/>
          <g stroke="#b9b2a4" stroke-width="1.8" opacity="0.85">
            <line x1="640" y1="380" x2="716" y2="380"/>
            <line x1="640" y1="380" x2="678" y2="445.8"/>
            <line x1="640" y1="380" x2="602" y2="445.8"/>
            <line x1="640" y1="380" x2="564" y2="380"/>
            <line x1="640" y1="380" x2="602" y2="314.2"/>
            <line x1="640" y1="380" x2="678" y2="314.2"/>
          </g>
          <circle cx="640" cy="380" r="8" fill="#e6e0d3"/>
          <circle cx="640" cy="303" r="3.2" fill="#ef5b4c"/>
        </g>

        <!-- 传动 -->
        <g>
          <path d="M 460 354 L 330 368 M 460 406 L 330 392" stroke="#8d8677"
                stroke-width="3" fill="none" opacity="0.9"/>
          <circle cx="330" cy="380" r="13" fill="none" stroke="#9a9284" stroke-width="5"/>
          <circle cx="460" cy="380" r="27" fill="#3a3450"/>
          <circle cx="460" cy="380" r="27" fill="none" stroke="#d8d0c0"
                  stroke-width="6" stroke-dasharray="3.2 3.6" opacity="0.9"/>
          <circle cx="460" cy="380" r="6" fill="#cdc7bb"/>
        </g>

        <!-- 近侧曲柄 + 踏板 + 鞋 -->
        <line id="crankNear" x1="460" y1="380" x2="460" y2="380"
              stroke="#e8e2d4" stroke-width="9" stroke-linecap="round"/>
        <g id="pedalNear">
          <rect x="-12" y="-1" width="24" height="8" rx="4" fill="#221d33"/>
          <path d="M -15 -2 L 9 -2 Q 18 -2 18 -10 L 5 -15 Q -10 -15 -15 -6 Z" fill="#4a5680"/>
        </g>

        <!-- 近侧腿 -->
        <path id="legNear" fill="none" stroke="#4a5680" stroke-width="18"
              stroke-linecap="round" stroke-linejoin="round" d=""/>

        <!-- 车把 -->
        <g fill="none" stroke="#2a2f45" stroke-linecap="round">
          <path d="M 600 246 L 618 224" stroke-width="9"/>
          <path d="M 618 224 C 642 224 660 230 658 242 C 656 254 644 260 636 256" stroke-width="9"/>
        </g>

        <!-- 骑手 -->
        <g id="torsoGroup">
          <path id="scarfTail1" fill="none" stroke="#ef5b4c" stroke-width="16" stroke-linecap="round" d=""/>
          <path id="scarfTail2" fill="none" stroke="#d9493c" stroke-width="11" stroke-linecap="round" d=""/>

          <path d="M 548 158 L 560 136" stroke="#ffd9b8" stroke-width="22" stroke-linecap="round"/>
          <path d="M 437 236 L 542 158" stroke="#fdf3e3" stroke-width="44" stroke-linecap="round"/>
          <ellipse cx="546" cy="158" rx="24" ry="15" fill="#ef5b4c"
                   transform="rotate(29 546 158)"/>

          <g id="head">
            <circle cx="566" cy="118" r="34" fill="#ffd9b8"/>
            <circle cx="534" cy="128" r="8" fill="#f7c9a4"/>
            <circle cx="598" cy="128" r="8" fill="#f7c9a4"/>
            <path d="M 529 114 A 37 37 0 0 1 603 114 Z" fill="#f2b544"/>
            <path d="M 600 112 L 620 120 L 598 126 Z" fill="#dd9c2b"/>
            <path d="M 552 82 Q 556 98 553 112" stroke="#ffffff" stroke-width="4"
                  fill="none" opacity="0.45" stroke-linecap="round"/>
            <ellipse cx="552" cy="126" rx="4.6" ry="6" fill="#3a2b3f"/>
            <ellipse cx="580" cy="126" rx="4.6" ry="6" fill="#3a2b3f"/>
            <circle cx="553.6" cy="123.6" r="1.7" fill="#ffffff"/>
            <circle cx="581.6" cy="123.6" r="1.7" fill="#ffffff"/>
            <ellipse cx="540" cy="140" rx="9" ry="5.5" fill="#ff9d8a" opacity="0.5"/>
            <ellipse cx="592" cy="140" rx="9" ry="5.5" fill="#ff9d8a" opacity="0.5"/>
            <path d="M 559 142 Q 566 150 573 142" stroke="#b4544f" stroke-width="2.8"
                  fill="none" stroke-linecap="round"/>
          </g>

          <path d="M 542 158 L 580 210" stroke="#fdf3e3" stroke-width="24" stroke-linecap="round"/>
          <path d="M 580 210 L 648 234" stroke="#fdf3e3" stroke-width="22" stroke-linecap="round"/>
          <circle cx="654" cy="240" r="12" fill="#ffd9b8"/>
        </g>
      </g>
    </svg>
  </div>
  <figcaption>醍醐骑单车 · <b>黄昏公路</b></figcaption>
</figure>

<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);

  const rearWheel = $("rearWheel");
  const frontWheel = $("frontWheel");
  const crankNear = $("crankNear");
  const crankFar = $("crankFar");
  const pedalNear = $("pedalNear");
  const pedalFar = $("pedalFar");
  const legNear = $("legNear");
  const legFar = $("legFar");
  const torsoGroup = $("torsoGroup");
  const scarfTail1 = $("scarfTail1");
  const scarfTail2 = $("scarfTail2");
  const roadMarks = $("roadMarks");
  const wind = $("wind");

  // ---- 几何参数（单位：SVG 用户坐标）----
  const REAR = { x: 330, y: 380 };
  const FRONT = { x: 640, y: 380 };
  const BB = { x: 460, y: 380 };
  const CRANK_R = 30;
  const HIP_NEAR = { x: 437, y: 236 };
  const HIP_FAR = { x: 441, y: 233 };
  const THIGH = 93;
  const SHIN = 93;
  const ANKLE_LIFT = 15;

  const CRANK_PERIOD = 1150; // 曲柄一圈（毫秒）
  const WHEEL_PERIOD = 425;  // 车轮一圈

  const marks = Array.from(roadMarks.children);
  const MARK_GAP = 130;
  const MARK_SPAN = marks.length * MARK_GAP;
  const clouds = Array.from($("clouds").children);
  const windLines = Array.from(wind.children);

  // 两段式反向运动学：已知髋与踝，求膝盖
  function solveKnee(hip, ankle, l1, l2) {
    const dx = ankle.x - hip.x;
    const dy = ankle.y - hip.y;
    const raw = Math.hypot(dx, dy) || 0.001;
    const d = Math.min(raw, l1 + l2 - 0.5);
    const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    const ux = dx / raw;
    const uy = dy / raw;
    const mx = hip.x + ux * a;
    const my = hip.y + uy * a;
    // 两个解里取 x 较大者 = 膝盖朝前
    const px = mx - uy * h;
    const py = my + ux * h;
    const qx = mx + uy * h;
    const qy = my - ux * h;
    return px > qx ? { x: px, y: py } : { x: qx, y: qy };
  }

  function legPath(hip, ankle) {
    const knee = solveKnee(hip, ankle, THIGH, SHIN);
    return (
      `M ${hip.x} ${hip.y}` +
      ` L ${knee.x.toFixed(1)} ${knee.y.toFixed(1)}` +
      ` L ${ankle.x.toFixed(1)} ${ankle.y.toFixed(1)}`
    );
  }

  function render(t) {
    // 车轮
    const wheelDeg = ((t / WHEEL_PERIOD) * 360) % 360;
    rearWheel.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)} ${REAR.x} ${REAR.y})`);
    frontWheel.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)} ${FRONT.x} ${FRONT.y})`);

    // 曲柄
    const ca = (t / CRANK_PERIOD) * Math.PI * 2;
    const cosA = Math.cos(ca);
    const sinA = Math.sin(ca);

    const pn = { x: BB.x + CRANK_R * cosA, y: BB.y + CRANK_R * sinA };
    const pf = { x: BB.x - CRANK_R * cosA, y: BB.y - CRANK_R * sinA };

    crankNear.setAttribute("x2", pn.x.toFixed(1));
    crankNear.setAttribute("y2", pn.y.toFixed(1));
    crankFar.setAttribute("x2", pf.x.toFixed(1));
    crankFar.setAttribute("y2", pf.y.toFixed(1));

    pedalNear.setAttribute("transform", `translate(${pn.x.toFixed(1)} ${pn.y.toFixed(1)})`);
    pedalFar.setAttribute("transform", `translate(${pf.x.toFixed(1)} ${pf.y.toFixed(1)})`);

    // 双腿
    legNear.setAttribute("d", legPath(HIP_NEAR, { x: pn.x, y: pn.y - ANKLE_LIFT }));
    legFar.setAttribute("d", legPath(HIP_FAR, { x: pf.x, y: pf.y - ANKLE_LIFT }));

    // 上半身随踩踏轻微起伏（一圈两次）
    const bob = Math.sin(ca * 2) * 1.1;
    torsoGroup.setAttribute("transform", `rotate(${bob.toFixed(2)} ${HIP_NEAR.x} ${HIP_NEAR.y})`);

    // 围巾飘动
    const w1 = Math.sin(t * 0.0042) * 9;
    const w2 = Math.sin(t * 0.0061 + 1.3) * 11;
    scarfTail1.setAttribute(
      "d",
      `M 538 158 C 512 ${(150 + w1).toFixed(1)} 488 ${(168 + w2).toFixed(1)} 466 ${(152 + w1 * 1.3).toFixed(1)}`
    );
    scarfTail2.setAttribute(
      "d",
      `M 536 166 C 516 ${(162 + w2).toFixed(1)} 498 ${(180 + w1).toFixed(1)} 482 ${(172 + w2 * 1.2).toFixed(1)}`
    );

    // 路面标线滚动
    const shift = (t * 0.38) % MARK_SPAN;
    marks.forEach((m, i) => {
      let x = i * MARK_GAP - shift;
      x = ((x % MARK_SPAN) + MARK_SPAN) % MARK_SPAN - 60;
      m.setAttribute("x1", x.toFixed(1));
      m.setAttribute("x2", (x + 56).toFixed(1));
    });

    // 云
    clouds.forEach((el, i) => {
      const baseX = Number(el.dataset.x) || 0;
      const baseY = Number(el.dataset.y) || 0;
      const speed = 0.024 + i * 0.008;
      const span = 1320;
      let x = ((baseX - t * speed) % span + span) % span - 200;
      el.setAttribute("transform", `translate(${x.toFixed(1)} ${baseY})`);
    });

    // 风线
    windLines.forEach((el, i) => {
      const phase = ((t * 0.0016 + i * 0.31) % 1 + 1) % 1;
      const x = 430 - phase * 400;
      el.setAttribute("x1", x.toFixed(1));
      el.setAttribute("x2", (x - 26 - i * 5).toFixed(1));
      el.setAttribute("opacity", (Math.sin(phase * Math.PI) * 0.55).toFixed(2));
    });
  }

  render(0);

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  if (reduceMotion.matches) return;

  let elapsed = 0;
  let last = null;

  function frame(now) {
    if (last === null) last = now;
    const dt = Math.min(now - last, 64);
    last = now;
    elapsed += dt;
    render(elapsed);
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
