<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博尔特骑自行车 ⚡</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;
    background:#12232f;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#dfe9ee;padding:20px;
  }
  h1{font-size:20px;font-weight:700;letter-spacing:3px}
  h1 em{color:#ffd54a;font-style:normal}
  svg{width:min(96vw,960px);height:auto;border-radius:18px;box-shadow:0 18px 60px rgba(0,0,0,.55)}
  #hint{font-size:13px;opacity:.7}
  /* 整车 + 骑手在路面上轻轻颠簸（SMIL 负责轮子和腿，CSS 负责颠簸，互不冲突） */
  #rig{animation:bounce .3s linear infinite}
  @keyframes bounce{50%{transform:translateY(2.6px)}}
  .cloud{animation:drift 16s linear infinite}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-520px)}}
</style>
</head>
<body>
<h1>⚡ <em>USAIN BOLT</em> ON A BIKE</h1>

    <stop offset=".6" stop-color="#ffd54a"/>

</defs>

<!-- 天空 -->
<rect x="0" y="0" width="960" height="448" fill="url(#sky)"/>
<circle cx="850" cy="86" r="90" fill="url(#sunG)"/>
<circle cx="850" cy="86" r="42" fill="#ffe27a"/>

<rect x="0" y="444" width="960" height="6" fill="#8d939b"/>
